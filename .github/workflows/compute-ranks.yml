name: Compute Country Kinch Ranks

on:
  schedule:
    # Daily at 09:17 UTC. Offset from the hour to avoid GitHub's busy minute.
    - cron: "17 9 * * *"
  workflow_dispatch: {}

concurrency:
  group: compute-ranks
  cancel-in-progress: false

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MYSQL_HOST: tobipch.mysql.db.hostpoint.ch
      MYSQL_USER: tobipch_admin
      MYSQL_DATABASE: tobipch_cubefeed
      MYSQL_PORT: "3306"
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Ensure target table exists
        run: npm run init-db

      - name: Compute and write rankings
        run: npm run compute
